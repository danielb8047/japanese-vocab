function App() {
  const [state, setState] = useState(null);
  const [view, setView] = useState("home");
  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [traceKey, setTraceKey] = useState(0);
  const [tally, setTally] = useState({ done: 0, right: 0 });
  const [save, setSave] = useState({ status: "checking", note: "Checking storage…" });
  const [backup, setBackup] = useState("");
  const [copied, setCopied] = useState("");
  const [bank, setBank] = useState([]);
  const [fetching, setFetching] = useState(false);
  const [fetchNote, setFetchNote] = useState("");
  const [paste, setPaste] = useState("");
  const [levelWords, setLevelWords] = useState({});
  const [browseCat, setBrowseCat] = useState(null);
  const [browseLevel, setBrowseLevel] = useState(null);   // null = the study level
  const [browseFrom, setBrowseFrom] = useState("home");
  const [browseLimit, setBrowseLimit] = useState(150);
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("mastery");
  const [loadingLevel, setLoadingLevel] = useState(false);
  const loaded = useRef(false);
  const { say, ok: ttsOk } = useSpeech();

  useEffect(() => {
    loadState().then((r) => {
      setState(r.data);
      setSave({ status: r.status, note: r.note });
      loaded.current = true;
    });
    loadBank().then(setBank);
  }, []);

  // Debounced write — batching avoids tripping the storage rate limit.
  useEffect(() => {
    if (!state || !loaded.current) return;
    const t = setTimeout(() => {
      saveState(state).then((r) =>
        setSave({ status: r.ok ? "ok" : "failed", note: r.note })
      );
    }, 500);
    return () => clearTimeout(t);
  }, [state]);

  const set = (fn) => setState((s) => (s ? fn(s) : s));

  const level = state ? state.settings.level : "N5";
  const bLevel = browseLevel || level;

  useEffect(() => {
    if (typeof document !== "undefined") document.body.dataset.view = view;
  }, [view]);

  // Browsing another level fetches its word file on demand.
  useEffect(() => {
    if (!bLevel || levelWords[bLevel]) return;
    loadLevel(bLevel).then((ws) => setLevelWords((m) => ({ ...m, [bLevel]: ws })));
  }, [bLevel]);

  const openBrowse = (catId, from, lv) => {
    setBrowseCat(catId);
    setBrowseFrom(from);
    setBrowseLevel(lv || null);
    setBrowseLimit(150);
    setView("browse");
  };

  // Pull in the deck for whichever level is being studied.
  useEffect(() => {
    if (levelWords[level]) return;
    setLoadingLevel(true);
    loadLevel(level).then((ws) => {
      setLevelWords((m) => ({ ...m, [level]: ws }));
      setLoadingLevel(false);
    });
  }, [level]);

  // Card ids embed the meaning, so rebuilding the deck can orphan progress on
  // words that are still there under a new gloss. Re-home those by reading,
  // but only where the reading identifies exactly one word. Runs once per
  // level, and only once both the deck and the saved progress are in hand.
  const migrated = useRef({});
  useEffect(() => {
    const ws = levelWords[level];
    if (!state || !ws || !ws.length || migrated.current[level]) return;
    migrated.current[level] = true;
    const byKana = {};
    for (const w of ws) (byKana[w.kana] = byKana[w.kana] || []).push(w);
    const live = new Set(ws.map((w) => w.id));
    set((st) => {
      let moved = 0;
      const cards = { ...st.cards };
      for (const id of Object.keys(st.cards)) {
        if (live.has(id)) continue;
        const kana = id.split(":")[1];
        const hits = byKana[kana];
        if (!hits || hits.length !== 1) continue;
        const target = hits[0].id;
        if (cards[target] && cards[target].seen) continue;
        cards[target] = cards[id];
        delete cards[id];
        moved++;
      }
      return moved ? { ...st, cards } : st;
    });
  }, [state, levelWords, level]);

  // Everything we know about, deduplicated by written form plus reading.
  const allWords = useMemo(
    () => mergeWords([levelWords[level] || (level === "N5" ? SEED : []), bank]),
    [bank, levelWords, level]
  );
  const DECK = useMemo(() => allWords.filter((w) => w.level === level), [allWords, level]);
  const unlockedCount = state ? state.unlocked[level] ?? 2 : 2;

  const unlockedCats = useMemo(() => CATS.slice(0, unlockedCount), [unlockedCount]);
  const pool = useMemo(
    () => DECK.filter((w) => unlockedCats.some((c) => c.id === w.cat)),
    [unlockedCats, DECK]
  );

  const mastery = useMemo(() => {
    if (!state || !pool.length) return 0;
    return pool.reduce((a, w) => a + cardMastery(state.cards[w.id]), 0) / pool.length;
  }, [state, pool]);

  const overall = useMemo(() => {
    if (!state || !DECK.length) return 0;
    return DECK.reduce((a, w) => a + cardMastery(state.cards[w.id]), 0) / DECK.length;
  }, [state, DECK]);

  // Unlock the next category once the current pool is well established.
  useEffect(() => {
    if (!state) return;
    if (mastery >= 0.4 && unlockedCount < CATS.length) {
      set((s) => ({ ...s, unlocked: { ...s.unlocked, [level]: unlockedCount + 1 } }));
    }
  }, [mastery, unlockedCount, level]);

  const today = new Date().toISOString().slice(0, 10);
  const fresh0 =
    state && state.newToday.date === today ? state.newToday : { count: 0, bonus: 0 };
  const newLeft = state
    ? Math.max(0, state.settings.newPerDay + (fresh0.bonus || 0) - (fresh0.count || 0))
    : 0;

  const dueList = useMemo(() => {
    if (!state) return [];
    const now = Date.now();
    return pool.filter((w) => {
      const c = state.cards[w.id];
      return c && c.seen && c.due <= now;
    });
  }, [state, pool]);

  const freshList = useMemo(() => {
    if (!state) return [];
    return pool.filter((w) => !state.cards[w.id] || !state.cards[w.id].seen);
  }, [state, pool]);

  const startSession = () => {
    const fresh = freshList.slice(0, newLeft);
    const q = [...dueList, ...fresh].sort(() => Math.random() - 0.5);
    if (!q.length) return;
    setQueue(q);
    setIdx(0);
    setRevealed(false);
    setTally({ done: 0, right: 0 });
    setView("review");
  };

  const current = queue[idx];

  // Play + trace whenever a new card surfaces.
  useEffect(() => {
    if (view !== "review" || !current || !state) return;
    setTraceKey((k) => k + 1);
    if (state.settings.autoplay) say(current.kana, state.settings.rate);
  }, [idx, view, current?.id]);

  const replay = () => {
    if (!current) return;
    setTraceKey((k) => k + 1);
    say(current.kana, state.settings.rate);
  };

  const commit = (w, card, correct, gradeIndex) => {
    const wasNew = !(state.cards[w.id] && state.cards[w.id].seen);
    set((s) => {
      const t = s.newToday.date === today ? s.newToday : { date: today, count: 0, bonus: 0 };
      return {
        ...s,
        cards: { ...s.cards, [w.id]: card },
        newToday: wasNew ? { ...t, date: today, count: t.count + 1 } : t,
        history:
          gradeIndex === undefined
            ? s.history || {}
            : recordAnswer(s.history || {}, wasNew, gradeIndex),
      };
    });
    setTally((t) => ({ done: t.done + 1, right: t.right + (correct ? 1 : 0) }));
    const rest = !correct ? [...queue.slice(idx + 1), w] : queue.slice(idx + 1);
    if (!rest.length) {
      setView("done");
      window.speechSynthesis && window.speechSynthesis.cancel();
    } else {
      setQueue(rest);
      setIdx(0);
      setRevealed(false);
    }
  };

  const answer = (g) =>
    commit(current, grade(state.cards[current.id] || newCard(), g), g > 0, g);

  // "I already know this" — parks the word at a month's interval rather than
  // walking it through the early steps.
  const knowIt = () =>
    commit(
      current,
      { ease: 2.6, interval: 30, reps: 3, lapses: 0, seen: true, due: Date.now() + 30 * DAY },
      true,
      3
    );

  const addMore = () =>
    set((s) => {
      const t = s.newToday.date === today ? s.newToday : { date: today, count: 0, bonus: 0 };
      return { ...s, newToday: { ...t, date: today, bonus: (t.bonus || 0) + 10 } };
    });

  const unlockNext = () =>
    set((s) => ({
      ...s,
      unlocked: { ...s.unlocked, [level]: Math.min(CATS.length, (s.unlocked[level] ?? 2) + 1) },
    }));

  const thinnestCat = () =>
    CATS.slice(0, unlockedCount)
      .map((c) => ({ id: c.id, n: DECK.filter((w) => w.cat === c.id).length }))
      .sort((a, b) => a.n - b.n)[0].id;

  const copyPrompt = (catId) => {
    const cat = catId || thinnestCat();
    const exclude = allWords.filter((w) => w.cat === cat).map((w) => w.kana);
    const text = buildPrompt({ level, cat, exclude, count: 20 });
    if (navigator.clipboard)
      navigator.clipboard.writeText(text).then(
        () => setFetchNote("Prompt copied. Paste it into Claude, then paste the JSON back below."),
        () => setPaste(text)
      );
    else setPaste(text);
  };

  const importWords = () => {
    try {
      const got = parseWordJson(paste, level);
      if (!got.length) throw new Error("Nothing usable in that text");
      const before = allWords.length;
      const merged = mergeWords([levelWords[level] || [], bank, got]);
      const added = merged.length - before;
      const next = merged.filter((w) => w.fetched);
      setBank(next);
      saveBank(next);
      setPaste("");
      setFetchNote(
        added
          ? `Added ${added} words${got.length - added ? `, skipped ${got.length - added} duplicates` : ""}.`
          : "Every word in that list was already in your deck."
      );
    } catch (e) {
      setFetchNote(`Couldn't import: ${String((e && e.message) || e).slice(0, 100)}`);
    }
  };

  const addWords = async (targetCat) => {
    if (fetching) return;
    setFetching(true);
    setFetchNote("Asking Claude for words…");
    try {
      const cats = targetCat ? [targetCat] : CATS.slice(0, unlockedCount).map((c) => c.id);
      // Pick whichever unlocked category currently has the fewest words.
      const pick = targetCat
        ? targetCat
        : cats
            .map((id) => ({ id, n: DECK.filter((w) => w.cat === id).length }))
            .sort((a, b) => a.n - b.n)[0].id;
      const exclude = allWords.filter((w) => w.cat === pick).map((w) => w.kana);
      const got = await fetchWords({ level, cat: pick, exclude, count: 20 });
      const before = allWords.length;
      const merged = mergeWords([SEED, bank, got]);
      const added = merged.length - before;
      const next = merged.filter((w) => w.fetched);
      setBank(next);
      saveBank(next);
      setFetchNote(
        added
          ? `Added ${added} new ${CATS.find((c) => c.id === pick).en.toLowerCase()} words${
              got.length - added ? `, skipped ${got.length - added} duplicates` : ""
            }.`
          : "Nothing new came back — everything returned was already in the deck."
      );
    } catch (e) {
      setFetchNote(`Couldn't fetch words: ${String((e && e.message) || e).slice(0, 100)}`);
    } finally {
      setFetching(false);
    }
  };

  // Returned as elements rather than a component, so the textarea keeps focus.
  const backupPanel = () => (
    <>
      <div className="flex gap-2 mt-2">
        <button
          onClick={() => {
            const t = JSON.stringify(state);
            setBackup(t);
            if (navigator.clipboard)
              navigator.clipboard.writeText(t).then(
                () => setCopied("Copied to clipboard"),
                () => setCopied("Select the text below and copy it")
              );
            else setCopied("Select the text below and copy it");
          }}
          className="flex-1 rounded-lg py-2"
          style={{ border: `1px solid ${C.line}`, color: C.indigoLt, fontFamily: SANS, fontSize: 12 }}
        >
          Copy progress out
        </button>
        <button
          onClick={() => {
            try {
              const p = JSON.parse(backup);
              if (!p || typeof p.cards !== "object") throw new Error();
              setState({ ...DEFAULTS, ...p, settings: { ...DEFAULTS.settings, ...(p.settings || {}) } });
              setBackup("");
              setCopied("Progress restored");
            } catch {
              setCopied("That isn't valid progress data — paste the whole line.");
            }
          }}
          disabled={!backup}
          className="flex-1 rounded-lg py-2"
          style={{
            border: `1px solid ${C.line}`,
            color: backup ? C.indigoLt : C.muted,
            fontFamily: SANS,
            fontSize: 12,
            opacity: backup ? 1 : 0.4,
          }}
        >
          Paste progress in
        </button>
      </div>
      <textarea
        value={backup}
        onChange={(e) => setBackup(e.target.value)}
        placeholder="Your progress appears here. Keep it somewhere safe, and paste it back to restore."
        rows={3}
        className="w-full mt-2 rounded-lg p-2"
        style={{ background: C.ink, border: `1px solid ${C.line}`, color: C.paper, fontFamily: MONO, fontSize: 10 }}
      />
      {copied && (
        <div className="mt-1" style={{ fontFamily: SANS, fontSize: 11, color: C.moss }}>
          {copied}
        </div>
      )}
    </>
  );

  if (!state)
    return (
      <div
        className="min-h-screen flex items-center justify-center"
        style={{ background: C.ink, color: C.muted, fontFamily: MONO, fontSize: 12 }}
      >
        読み込み中…
      </div>
    );

  const catStats = CATS.map((c, i) => {
    const ws = DECK.filter((w) => w.cat === c.id);
    const m = ws.reduce((a, w) => a + cardMastery(state.cards[w.id]), 0) / ws.length;
    return { ...c, count: ws.length, mastery: ws.length ? m : 0, locked: i >= unlockedCount };
  });

  return (
    <div className="min-h-screen w-full" style={{ background: C.ink, fontFamily: SANS }}>
      <style>{`
        @keyframes jpTrace { to { stroke-dashoffset: 0; } }
        @keyframes jpRise { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:none;} }
        button:focus-visible { outline: 2px solid ${C.indigoLt}; outline-offset: 2px; }
        rt { user-select: none; }
      `}</style>

      <div className="mx-auto w-full max-w-md px-5 pb-16 pt-8">
        {/* masthead */}
        <div className="flex items-baseline justify-between mb-7">
          <div className="flex items-baseline gap-3">
            <span style={{ fontFamily: JP_FACE, fontSize: 26, color: C.paper, letterSpacing: "0.08em" }}>
              語彙
            </span>
            <Label>JLPT {level} · {DECK.length} words</Label>
          </div>
          <div className="flex gap-2">
            <button
              onClick={() => setView(view === "library" ? "home" : "library")}
              className="rounded-full px-3 py-1"
              style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.12em", color: C.gold, border: `1px solid ${C.line}` }}
            >
              {view === "library" ? "BACK" : "WORDS"}
            </button>
            <button
              onClick={() => setView(view === "settings" ? "home" : "settings")}
              className="rounded-full px-3 py-1"
              style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.12em", color: C.indigoLt, border: `1px solid ${C.line}` }}
            >
              {view === "settings" ? "BACK" : "SETUP"}
            </button>
          </div>
        </div>

        {/* ---------------- HOME ---------------- */}
        {view === "home" && (
          <div style={{ animation: "jpRise .4s ease both" }}>
            {save.status !== "ok" && save.status !== "checking" && (
              <div
                className="rounded-xl px-4 py-3 mb-4"
                style={{ border: `1px solid ${C.brick}`, background: "rgba(168,84,73,.12)" }}
              >
                <div style={{ fontFamily: SANS, fontSize: 13, color: C.paper, fontWeight: 600 }}>
                  Progress isn't saving
                </div>
                <div className="mt-1" style={{ fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.5 }}>
                  {save.note} If Code execution and file creation is already on in
                  Claude's settings, this is the artifact host rather than your
                  setup — copy your progress out before you close the app, and
                  paste it back when you return.
                </div>
                {backupPanel()}
              </div>
            )}
            <div className="rounded-2xl p-5 mb-4" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
              <div className="flex items-end justify-between mb-3">
                <div>
                  <Label>Mastery of unlocked words</Label>
                  <div style={{ fontFamily: MONO, fontSize: 40, color: C.paper, lineHeight: 1.1 }}>
                    {Math.round(mastery * 100)}
                    <span style={{ fontSize: 18, color: C.muted }}>%</span>
                  </div>
                </div>
                <div className="text-right">
                  <Label>Whole N5 set</Label>
                  <div style={{ fontFamily: MONO, fontSize: 18, color: C.indigoLt }}>
                    {Math.round(overall * 100)}%
                  </div>
                </div>
              </div>
              <Bar value={mastery} />
              <div className="mt-3" style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}>
                {unlockedCount < CATS.length
                  ? `Reach 40% to unlock ${CATS[unlockedCount].en.toLowerCase()} — or open it yourself below.`
                  : "Every category is open. Keep the reviews coming."}
              </div>
            </div>

            <div className="grid grid-cols-3 gap-3 mb-5">
              {[
                ["Due now", dueList.length],
                ["New today", Math.min(newLeft, freshList.length)],
                ["Words open", pool.length],
              ].map(([l, v]) => (
                <div key={l} className="rounded-xl p-3" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
                  <div style={{ fontFamily: MONO, fontSize: 22, color: C.paper }}>{v}</div>
                  <div style={{ fontFamily: SANS, fontSize: 11, color: C.muted }}>{l}</div>
                </div>
              ))}
            </div>

            <button
              onClick={startSession}
              disabled={!dueList.length && !Math.min(newLeft, freshList.length)}
              className="w-full rounded-xl py-4 mb-7"
              style={{
                background:
                  dueList.length || Math.min(newLeft, freshList.length) ? C.paper : C.inkSoft,
                color: dueList.length || Math.min(newLeft, freshList.length) ? C.ink : C.muted,
                border: `1px solid ${C.line}`,
                fontFamily: SANS,
                fontSize: 15,
                fontWeight: 600,
              }}
            >
              {dueList.length || Math.min(newLeft, freshList.length)
                ? "Start reviewing"
                : DECK.length === 0
                ? `No ${level} words yet — add some in Words`
                : "Nothing due — come back later"}
            </button>

            <div className="grid grid-cols-2 gap-3 -mt-4 mb-7">
              <button
                onClick={addMore}
                disabled={!freshList.length}
                className="rounded-xl py-3"
                style={{
                  border: `1px solid ${C.line}`,
                  color: freshList.length ? C.indigoLt : C.muted,
                  fontFamily: SANS,
                  fontSize: 13,
                  opacity: freshList.length ? 1 : 0.4,
                }}
              >
                +10 new words
              </button>
              <button
                onClick={unlockNext}
                disabled={unlockedCount >= CATS.length}
                className="rounded-xl py-3"
                style={{
                  border: `1px solid ${C.line}`,
                  color: unlockedCount < CATS.length ? C.indigoLt : C.muted,
                  fontFamily: SANS,
                  fontSize: 13,
                  opacity: unlockedCount < CATS.length ? 1 : 0.4,
                }}
              >
                {unlockedCount < CATS.length
                  ? `Unlock ${CATS[unlockedCount].jp}`
                  : "All unlocked"}
              </button>
            </div>

            <button
              onClick={() => setView("stats")}
              className="w-full rounded-xl py-3 mb-6 flex items-center justify-center gap-2"
              style={{ border: `1px solid ${C.line}`, background: C.inkSoft, color: C.indigoLt, fontFamily: SANS, fontSize: 14 }}
            >
              Daily progress
              <span style={{ fontSize: 15, lineHeight: 1 }}>›</span>
            </button>

            <Label>Categories</Label>
            <div className="mt-3 space-y-2">
              {catStats.map((c) => (
                <div
                  key={c.id}
                  onClick={() => {
                    if (c.locked || !c.count) return;
                    openBrowse(c.id, "home", null);
                  }}
                  role={c.locked ? undefined : "button"}
                  className="rounded-xl px-4 py-3 flex items-center gap-3"
                  style={{
                    background: c.locked ? "transparent" : C.inkSoft,
                    border: `1px solid ${c.locked ? "#2A3A5C" : C.line}`,
                    opacity: c.locked ? 0.45 : 1,
                    cursor: c.locked ? "default" : "pointer",
                  }}
                >
                  {/* indigo swatch — dyes deeper as mastery rises */}
                  <div
                    className="rounded-md shrink-0 overflow-hidden flex items-end"
                    style={{ width: 26, height: 26, background: "#26365A" }}
                  >
                    <div style={{ width: "100%", height: `${c.mastery * 100}%`, background: C.indigoLt }} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div style={{ fontFamily: JP_FACE, fontSize: 15, color: C.paper }}>
                      {c.jp}
                      <span style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}> · {c.en}</span>
                    </div>
                  </div>
                  <div style={{ fontFamily: MONO, fontSize: 11, color: c.locked ? C.muted : C.indigoLt }}>
                    {c.locked ? "LOCKED" : `${Math.round(c.mastery * 100)}% / ${c.count}`}
                  </div>
                  {!c.locked && (
                    <span style={{ color: C.muted, fontSize: 16, lineHeight: 1 }}>›</span>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ---------------- REVIEW ---------------- */}
        {view === "review" && current && (
          <div style={{ animation: "jpRise .3s ease both" }}>
            <div className="flex items-center justify-between mb-3">
              <Label>{CATS.find((c) => c.id === current.cat).en} · {current.level || level}</Label>
              <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>
                {queue.length} left
              </div>
            </div>

            <div
              className="rounded-3xl px-5 pt-9 pb-6 flex flex-col items-center"
              style={{ background: C.paper, boxShadow: "0 18px 40px rgba(0,0,0,.35)" }}
            >
              <Furigana src={current.jp} size={58} />

              {current.ctx && (
                <div className="mt-2" style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}>
                  in the sense of “{current.ctx}”
                </div>
              )}

              {state.settings.showPitch && current.pitch >= 0 && (
                <div className="mt-5">
                  <PitchContour
                    kana={current.kana}
                    drop={current.pitch}
                    traceKey={traceKey}
                    source={current.ps}
                  />
                </div>
              )}

              <button
                onClick={replay}
                className="mt-4 rounded-full px-5 py-2"
                style={{
                  border: `1px solid ${C.paperEdge}`,
                  color: C.indigo,
                  fontFamily: SANS,
                  fontSize: 13,
                }}
              >
                ▶ Play again
              </button>
              {!ttsOk && (
                <div className="mt-2 text-center" style={{ fontFamily: SANS, fontSize: 11, color: C.brick }}>
                  No Japanese voice found on this device. Add one in your system
                  speech settings.
                </div>
              )}

              <div
                className="w-full mt-6 pt-5 text-center"
                style={{ borderTop: `1px solid ${C.paperEdge}`, minHeight: 62 }}
              >
                {revealed ? (
                  <div style={{ animation: "jpRise .25s ease both" }}>
                    <div style={{ fontFamily: SANS, fontSize: 20, color: C.ink, fontWeight: 500 }}>
                      {current.en}
                    </div>
                    {current.note && (
                      <div
                        className="mt-3 rounded-lg px-3 py-2 text-left"
                        style={{ background: "rgba(44,66,101,.07)", border: `1px solid ${C.paperEdge}` }}
                      >
                        <div style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.14em", color: C.indigo }}>
                          WHEN TO USE IT
                        </div>
                        <div className="mt-1" style={{ fontFamily: SANS, fontSize: 13, color: C.ink, lineHeight: 1.5 }}>
                          {current.note}
                        </div>
                      </div>
                    )}

                    {current.cf && current.cf.length > 0 && (
                      <div className="mt-2 flex flex-wrap items-center justify-center gap-2">
                        <span style={{ fontFamily: SANS, fontSize: 11, color: C.muted }}>
                          not to be confused with
                        </span>
                        {current.cf.map((x, i) => (
                          <span
                            key={i}
                            className="rounded-full px-2 py-0.5"
                            style={{ border: `1px solid ${C.paperEdge}`, fontFamily: JP_FACE, fontSize: 14, color: C.indigo }}
                          >
                            <Furigana src={x.jp} size={14} />
                          </span>
                        ))}
                      </div>
                    )}

                    {current.ex && (
                      <div className="mt-3">
                        <div style={{ fontFamily: JP_FACE, fontSize: 16, color: C.indigo }}>
                          {current.ex.ja}
                        </div>
                        <div className="mt-1" style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}>
                          {current.ex.en}
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <button
                    onClick={() => setRevealed(true)}
                    style={{ fontFamily: SANS, fontSize: 14, color: C.muted }}
                  >
                    Tap to show the meaning
                  </button>
                )}
              </div>
            </div>

            {/* Pinned to the bottom of the screen: a card carrying a note, a
                comparison and an example sentence can be taller than the phone,
                and in normal flow that pushed these buttons out of reach. */}
            <div
              className="sticky bottom-0 -mx-5 px-5 pt-5 mt-2"
              style={{
                zIndex: 15,
                paddingBottom: "calc(12px + env(safe-area-inset-bottom, 0px))",
                background: `linear-gradient(to top, ${C.ink} 78%, rgba(19,30,51,0))`,
              }}
            >
            {revealed ? (
              <div className="grid grid-cols-4 gap-2">
                {[
                  ["Again", C.brick, 0],
                  ["Hard", C.gold, 1],
                  ["Good", C.moss, 2],
                  ["Easy", C.indigoLt, 3],
                ].map(([l, col, g]) => (
                  <button
                    key={l}
                    onClick={() => answer(g)}
                    className="rounded-xl py-3"
                    style={{
                      background: C.inkSoft,
                      border: `1px solid ${col}`,
                      color: col,
                      fontFamily: SANS,
                      fontSize: 13,
                      fontWeight: 600,
                    }}
                  >
                    {l}
                  </button>
                ))}
              </div>
            ) : (
              <button
                onClick={() => setRevealed(true)}
                className="w-full rounded-xl py-4"
                style={{ background: C.panel, color: C.paper, fontFamily: SANS, fontSize: 15, fontWeight: 600 }}
              >
                Show meaning
              </button>
            )}

            <div className="flex items-center justify-between mt-3">
              <button
                onClick={knowIt}
                className="rounded-lg px-3 py-2"
                style={{ fontFamily: SANS, fontSize: 12, color: C.indigoLt, border: `1px solid ${C.line}` }}
              >
                I already know this
              </button>
              <button
                onClick={() => {
                  window.speechSynthesis && window.speechSynthesis.cancel();
                  setView("home");
                }}
                className="py-2 px-2"
                style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}
              >
                End session
              </button>
            </div>
            </div>
          </div>
        )}

        {/* ---------------- DONE ---------------- */}
        {view === "done" && (
          <div className="rounded-2xl p-6 text-center" style={{ background: C.inkSoft, border: `1px solid ${C.line}`, animation: "jpRise .4s ease both" }}>
            <div style={{ fontFamily: JP_FACE, fontSize: 30, color: C.paper }}>お疲[つか]れさま</div>
            <div className="mt-3" style={{ fontFamily: MONO, fontSize: 13, color: C.indigoLt }}>
              {tally.done} cards · {tally.done ? Math.round((tally.right / tally.done) * 100) : 0}% recalled
            </div>
            <button
              onClick={() => setView("home")}
              className="mt-6 w-full rounded-xl py-3"
              style={{ background: C.paper, color: C.ink, fontFamily: SANS, fontSize: 14, fontWeight: 600 }}
            >
              Back to the deck
            </button>

            {save.status === "failed" && (
              <div className="mt-5 pt-4 text-left" style={{ borderTop: `1px solid ${C.line}` }}>
                <div style={{ fontFamily: SANS, fontSize: 13, color: C.brick, fontWeight: 600 }}>
                  Save this before you close the app
                </div>
                <div className="mt-1" style={{ fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.5 }}>
                  Storage isn't working here, so this session is only in memory.
                  Copy the text out and keep it in a note.
                </div>
                {backupPanel()}
              </div>
            )}
          </div>
        )}

        {/* ---------------- BROWSE A CATEGORY ---------------- */}
        {view === "browse" && browseCat && (() => {
          const cat = CATS.find((c) => c.id === browseCat);
          const source =
            bLevel === level
              ? DECK
              : mergeWords([levelWords[bLevel] || [], bank]).filter((w) => w.level === bLevel);
          let words = source.filter((w) => w.cat === browseCat);
          const catIndex = CATS.findIndex((c) => c.id === browseCat);
          const lockedHere = catIndex >= (state.unlocked[bLevel] ?? 2);
          words = words.slice().sort((a, b) => {
            if (sortBy === "mastery")
              return cardMastery(state.cards[b.id]) - cardMastery(state.cards[a.id]);
            if (sortBy === "kana") return a.kana.localeCompare(b.kana, "ja");
            return 0;
          });
          const learned = words.filter((w) => (state.cards[w.id] || {}).seen).length;
          return (
            <div style={{ animation: "jpRise .3s ease both" }}>
              <button
                onClick={() => setView(browseFrom)}
                className="mb-4"
                style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}
              >
                ‹ {browseFrom === "library" ? "Words" : "All categories"}
              </button>

              <div className="rounded-xl px-4 py-4 mb-4" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
                <div style={{ fontFamily: JP_FACE, fontSize: 20, color: C.paper }}>{cat.jp}</div>
                <div className="mt-1" style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}>
                  {bLevel} · {cat.en} · {words.length} words · {learned} started
                </div>
                {lockedHere && (
                  <div className="mt-2" style={{ fontFamily: SANS, fontSize: 12, color: C.gold }}>
                    Not unlocked for review yet — you can look, but these won't come up in sessions.
                  </div>
                )}
              </div>

              <div className="flex gap-2 mb-3">
                {[["mastery", "By mastery"], ["kana", "A–Z"]].map(([k, l]) => (
                  <button
                    key={k}
                    onClick={() => setSortBy(k)}
                    className="rounded-full px-3 py-1"
                    style={{
                      border: `1px solid ${sortBy === k ? C.indigoLt : C.line}`,
                      color: sortBy === k ? C.indigoLt : C.muted,
                      fontFamily: SANS,
                      fontSize: 12,
                    }}
                  >
                    {l}
                  </button>
                ))}
              </div>

              <div className="space-y-2">
                {!levelWords[bLevel] && bLevel !== level && (
                  <div style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}>Loading {bLevel}…</div>
                )}
                {words.slice(0, browseLimit).map((w) => {
                  const card = state.cards[w.id];
                  const m = cardMastery(card);
                  return (
                    <div
                      key={w.id}
                      className="rounded-xl px-4 py-3"
                      style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}
                    >
                      <div className="flex items-start gap-3">
                        <div className="flex-1 min-w-0">
                          <Furigana
                            src={w.jp}
                            size={19}
                            color={C.paper}
                            rubyColor={C.indigoLt}
                          />
                          <div className="mt-1" style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}>
                            {w.en}
                          </div>
                        </div>
                        <button
                          onClick={() => say(w.kana, state.settings.rate)}
                          className="rounded-full px-2 py-1 shrink-0"
                          style={{ border: `1px solid ${C.line}`, color: C.indigoLt, fontSize: 12 }}
                          aria-label={`Play ${w.kana}`}
                        >
                          ▶
                        </button>
                      </div>

                      <div className="mt-3 flex items-center gap-3">
                        <div className="flex-1">
                          <Bar
                            value={m}
                            tint={m >= 0.99 ? C.indigoLt : m > 0 ? C.moss : C.line}
                            h={5}
                          />
                        </div>
                        <span style={{ fontFamily: MONO, fontSize: 10, color: C.muted, minWidth: 74, textAlign: "right" }}>
                          {!card || !card.seen
                            ? "not started"
                            : m >= 0.99
                            ? "mastered"
                            : `${Math.round(m * 100)}% · ${card.interval}d`}
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
              {words.length > browseLimit && (
                <button
                  onClick={() => setBrowseLimit((n) => n + 150)}
                  className="w-full rounded-xl py-3 mt-3"
                  style={{ border: `1px solid ${C.line}`, color: C.indigoLt, fontFamily: SANS, fontSize: 13 }}
                >
                  Show more · {words.length - browseLimit} to go
                </button>
              )}
            </div>
          );
        })()}

        {/* ---------------- DAILY PROGRESS ---------------- */}
        {view === "stats" && (() => {
          const hist = state.history || {};
          const days = [];
          for (let i = 13; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const k = dayKey(d);
            days.push({ k, d, ...(hist[k] || { n: 0, r: 0, g: [0, 0, 0, 0] }) });
          }
          const peak = Math.max(1, ...days.map((x) => x.g.reduce((a, b) => a + b, 0)));
          const totals = days.reduce(
            (a, x) => a.map((v, i) => v + x.g[i]),
            [0, 0, 0, 0]
          );
          const grand = totals.reduce((a, b) => a + b, 0);
          const H = 130;
          const active = days.filter((x) => x.g.reduce((a, b) => a + b, 0) > 0).length;

          return (
            <div style={{ animation: "jpRise .3s ease both" }}>
              <button
                onClick={() => setView("home")}
                className="mb-4"
                style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}
              >
                ‹ Back
              </button>

              {grand === 0 ? (
                <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
                  <div style={{ fontFamily: SANS, fontSize: 14, color: C.paper }}>
                    Nothing logged yet
                  </div>
                  <div className="mt-2" style={{ fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.6 }}>
                    Reviews are recorded from now on. Come back after a session
                    or two and this fills in.
                  </div>
                </div>
              ) : (
                <>
                  <div className="grid grid-cols-3 gap-3 mb-5">
                    {[
                      ["Cards, 14 days", grand],
                      ["Days active", active],
                      ["Recall rate", `${Math.round(((grand - totals[0]) / grand) * 100)}%`],
                    ].map(([l, v]) => (
                      <div key={l} className="rounded-xl p-3" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
                        <div style={{ fontFamily: MONO, fontSize: 20, color: C.paper }}>{v}</div>
                        <div style={{ fontFamily: SANS, fontSize: 11, color: C.muted }}>{l}</div>
                      </div>
                    ))}
                  </div>

                  <Label>How you graded each day</Label>
                  <div
                    className="rounded-xl px-3 pt-4 pb-3 mt-3"
                    style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}
                  >
                    <div className="flex items-end justify-between gap-1" style={{ height: H }}>
                      {days.map((x) => {
                        const tot = x.g.reduce((a, b) => a + b, 0);
                        return (
                          <div key={x.k} className="flex-1 flex flex-col justify-end items-center" style={{ height: H }}>
                            {tot > 0 && (
                              <span style={{ fontFamily: MONO, fontSize: 8, color: C.muted, marginBottom: 2 }}>
                                {tot}
                              </span>
                            )}
                            <div
                              className="w-full rounded-sm overflow-hidden flex flex-col-reverse"
                              style={{ height: (tot / peak) * (H - 16), minHeight: tot ? 3 : 0, background: "transparent" }}
                            >
                              {GRADES.map((g, i) =>
                                x.g[i] ? (
                                  <div
                                    key={g.key}
                                    style={{ height: `${(x.g[i] / tot) * 100}%`, background: g.colour }}
                                    title={`${g.label}: ${x.g[i]}`}
                                  />
                                ) : null
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                    <div className="flex justify-between gap-1 mt-2">
                      {days.map((x, i) => (
                        <div
                          key={x.k}
                          className="flex-1 text-center"
                          style={{ fontFamily: MONO, fontSize: 8, color: C.muted }}
                        >
                          {i % 2 === 0 ? x.d.getDate() : ""}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="flex flex-wrap gap-3 mt-3 mb-6">
                    {GRADES.map((g, i) => (
                      <div key={g.key} className="flex items-center gap-1.5">
                        <span style={{ width: 10, height: 10, borderRadius: 2, background: g.colour, display: "inline-block" }} />
                        <span style={{ fontFamily: SANS, fontSize: 11, color: C.muted }}>
                          {g.label} {grand ? `${Math.round((totals[i] / grand) * 100)}%` : ""}
                        </span>
                      </div>
                    ))}
                  </div>

                  <Label>New words against reviews</Label>
                  <div
                    className="rounded-xl px-3 pt-4 pb-3 mt-3"
                    style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}
                  >
                    {(() => {
                      const peak2 = Math.max(1, ...days.map((x) => x.n + x.r));
                      return (
                        <div className="flex items-end justify-between gap-1" style={{ height: 90 }}>
                          {days.map((x) => (
                            <div key={x.k} className="flex-1 flex flex-col justify-end" style={{ height: 90 }}>
                              <div
                                className="w-full rounded-sm overflow-hidden flex flex-col-reverse"
                                style={{ height: ((x.n + x.r) / peak2) * 78, minHeight: x.n + x.r ? 3 : 0 }}
                              >
                                <div style={{ height: `${x.n + x.r ? (x.n / (x.n + x.r)) * 100 : 0}%`, background: C.gold }} />
                                <div style={{ height: `${x.n + x.r ? (x.r / (x.n + x.r)) * 100 : 0}%`, background: C.indigo }} />
                              </div>
                            </div>
                          ))}
                        </div>
                      );
                    })()}
                  </div>
                  <div className="flex gap-3 mt-3">
                    {[["New words", C.gold], ["Reviews", C.indigo]].map(([l, col]) => (
                      <div key={l} className="flex items-center gap-1.5">
                        <span style={{ width: 10, height: 10, borderRadius: 2, background: col, display: "inline-block" }} />
                        <span style={{ fontFamily: SANS, fontSize: 11, color: C.muted }}>{l}</span>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>
          );
        })()}

        {/* ---------------- LIBRARY ---------------- */}
        {view === "library" && (
          <div className="space-y-4" style={{ animation: "jpRise .3s ease both" }}>
            <div className="rounded-xl px-4 py-4" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
              <Label>Level you're studying</Label>
              <div className="grid grid-cols-5 gap-2 mt-3">
                {LEVELS.map((l) => (
                  <button
                    key={l}
                    onClick={() => set((s) => ({ ...s, settings: { ...s.settings, level: l } }))}
                    className="rounded-lg py-2"
                    style={{
                      border: `1px solid ${l === level ? C.gold : C.line}`,
                      background: l === level ? "rgba(179,150,83,.14)" : "transparent",
                      color: l === level ? C.gold : C.muted,
                      fontFamily: MONO,
                      fontSize: 12,
                    }}
                  >
                    {l}
                  </button>
                ))}
              </div>
              <p className="mt-3" style={{ fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.6 }}>
                Each level has its own deck and its own unlock progress. Reviews
                only draw from the level you're on.
              </p>
            </div>

            <button
              onClick={() => copyPrompt(null)}
              className="w-full rounded-xl py-4"
              style={{
                background: C.paper,
                color: C.ink,
                border: `1px solid ${C.line}`,
                fontFamily: SANS,
                fontSize: 15,
                fontWeight: 600,
              }}
            >
              Copy a prompt for more {level} words
            </button>

            <textarea
              value={paste}
              onChange={(e) => setPaste(e.target.value)}
              placeholder="Paste the JSON list Claude gives you here, then tap Import."
              rows={4}
              className="w-full rounded-xl p-3"
              style={{ background: C.inkSoft, border: `1px solid ${C.line}`, color: C.paper, fontFamily: MONO, fontSize: 11 }}
            />
            <button
              onClick={importWords}
              disabled={!paste.trim()}
              className="w-full rounded-xl py-3"
              style={{
                border: `1px solid ${C.line}`,
                color: paste.trim() ? C.indigoLt : C.muted,
                fontFamily: SANS,
                fontSize: 14,
                opacity: paste.trim() ? 1 : 0.4,
              }}
            >
              Import words
            </button>

            {fetchNote && (
              <div
                className="rounded-xl px-4 py-3"
                style={{ background: C.inkSoft, border: `1px solid ${C.line}`, fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.5 }}
              >
                {fetchNote}
              </div>
            )}

            <div className="pt-2">
              <Label>Browse every word</Label>
              <p className="mt-2" style={{ fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.6 }}>
                The whole dictionary, locked categories and other levels
                included. Browsing doesn't change what you're studying.
              </p>
            </div>

            <div className="grid grid-cols-5 gap-2">
              {LEVELS.map((l) => (
                <button
                  key={l}
                  onClick={() => { setBrowseLevel(l); setSearch(""); }}
                  className="rounded-lg py-2"
                  style={{
                    border: `1px solid ${l === bLevel ? C.indigoLt : C.line}`,
                    color: l === bLevel ? C.indigoLt : C.muted,
                    fontFamily: MONO,
                    fontSize: 12,
                  }}
                >
                  {l}
                </button>
              ))}
            </div>

            <input
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder={`Search ${bLevel} — kanji, kana or English`}
              className="w-full rounded-xl px-3 py-3"
              style={{ background: C.inkSoft, border: `1px solid ${C.line}`, color: C.paper, fontFamily: SANS, fontSize: 14 }}
            />

            {(() => {
              const all =
                bLevel === level
                  ? DECK
                  : mergeWords([levelWords[bLevel] || [], bank]).filter((w) => w.level === bLevel);
              if (!all.length)
                return (
                  <div style={{ fontFamily: SANS, fontSize: 13, color: C.muted }}>Loading {bLevel}…</div>
                );

              const q = search.trim().toLowerCase();
              if (q) {
                const hits = all.filter(
                  (w) =>
                    surface(w.jp).includes(search.trim()) ||
                    w.kana.includes(search.trim()) ||
                    w.en.toLowerCase().includes(q)
                );
                return (
                  <div className="space-y-2">
                    <div style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}>
                      {hits.length} match{hits.length === 1 ? "" : "es"}
                      {hits.length > 60 ? " — showing the first 60" : ""}
                    </div>
                    {hits.slice(0, 60).map((w) => {
                      const m = cardMastery(state.cards[w.id]);
                      const catName = (CATS.find((c) => c.id === w.cat) || {}).en;
                      return (
                        <div
                          key={w.id}
                          className="rounded-xl px-4 py-3 flex items-center gap-3"
                          style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}
                        >
                          <div className="flex-1 min-w-0">
                            <Furigana src={w.jp} size={18} color={C.paper} rubyColor={C.indigoLt} />
                            <div style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}>
                              {w.en}
                            </div>
                            <div className="mt-1" style={{ fontFamily: MONO, fontSize: 9, color: C.muted, letterSpacing: "0.08em" }}>
                              {catName}
                              {state.cards[w.id] && state.cards[w.id].seen ? ` · ${Math.round(m * 100)}%` : ""}
                            </div>
                          </div>
                          <button
                            onClick={() => say(w.kana, state.settings.rate)}
                            className="rounded-full px-2 py-1 shrink-0"
                            style={{ border: `1px solid ${C.line}`, color: C.indigoLt, fontSize: 12 }}
                            aria-label={`Play ${w.kana}`}
                          >
                            ▶
                          </button>
                        </div>
                      );
                    })}
                  </div>
                );
              }

              const unlockedHere = state.unlocked[bLevel] ?? 2;
              return (
                <div className="space-y-2">
                  {CATS.map((c, i) => {
                    const n = all.filter((w) => w.cat === c.id).length;
                    if (!n) return null;
                    const locked = i >= unlockedHere;
                    return (
                      <div
                        key={c.id}
                        role="button"
                        onClick={() => openBrowse(c.id, "library", bLevel)}
                        className="rounded-xl px-4 py-3 flex items-center gap-3"
                        style={{ background: C.inkSoft, border: `1px solid ${C.line}`, cursor: "pointer" }}
                      >
                        <div className="flex-1 min-w-0">
                          <div style={{ fontFamily: JP_FACE, fontSize: 15, color: C.paper }}>
                            {c.jp}
                            <span style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}> · {c.en}</span>
                          </div>
                        </div>
                        {locked && (
                          <span style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.1em", color: C.muted }}>
                            LOCKED
                          </span>
                        )}
                        <span style={{ fontFamily: MONO, fontSize: 11, color: C.indigoLt }}>{n}</span>
                        <span style={{ color: C.muted, fontSize: 16, lineHeight: 1 }}>›</span>
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            <div className="pt-4">
              <Label>Add your own words</Label>
            </div>

            <Label>Fill a specific category</Label>
            <div className="space-y-2">
              {CATS.map((c) => {
                const n = DECK.filter((w) => w.cat === c.id).length;
                return (
                  <div
                    key={c.id}
                    className="rounded-xl px-4 py-3 flex items-center gap-3"
                    style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}
                  >
                    <div className="flex-1 min-w-0">
                      <div style={{ fontFamily: JP_FACE, fontSize: 15, color: C.paper }}>
                        {c.jp}
                        <span style={{ fontFamily: SANS, fontSize: 12, color: C.muted }}> · {c.en}</span>
                      </div>
                    </div>
                    <div style={{ fontFamily: MONO, fontSize: 11, color: C.muted }}>{n}</div>
                    <button
                      onClick={() => copyPrompt(c.id)}
                      className="rounded-lg px-3 py-1"
                      style={{
                        border: `1px solid ${C.line}`,
                        color: C.indigoLt,
                        fontFamily: SANS,
                        fontSize: 12,
                      }}
                    >
                      prompt
                    </button>
                  </div>
                );
              })}
            </div>

            <div className="rounded-xl px-4 py-4" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
              <Label>How this works</Label>
              <p className="mt-2" style={{ fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.6 }}>
                The deck is built from JMdict-derived sources with real pitch\n                accent data. To add beyond it, copy a prompt, paste it into any\n                Claude conversation, then paste the JSON back here. Imports are\n                checked before they're kept:
                anything with a broken reading, an impossible pitch value or a
                written form and reading already in your deck is discarded.
                Readings and meanings are usually sound. Pitch accents and level
                assignments are the weak spots — check anything that matters
                against OJAD. {allWords.filter((w) => w.fetched).length} fetched
                words are stored so far.
              </p>
            </div>
          </div>
        )}

        {/* ---------------- SETTINGS ---------------- */}
        {view === "settings" && (
          <div className="space-y-4" style={{ animation: "jpRise .3s ease both" }}>
            {[
              {
                label: "Play audio automatically",
                node: (
                  <button
                    onClick={() => set((s) => ({ ...s, settings: { ...s.settings, autoplay: !s.settings.autoplay } }))}
                    className="rounded-full px-4 py-1"
                    style={{
                      border: `1px solid ${state.settings.autoplay ? C.moss : C.line}`,
                      color: state.settings.autoplay ? C.moss : C.muted,
                      fontFamily: MONO,
                      fontSize: 11,
                    }}
                  >
                    {state.settings.autoplay ? "ON" : "OFF"}
                  </button>
                ),
              },
              {
                label: "Show the pitch contour",
                node: (
                  <button
                    onClick={() => set((s) => ({ ...s, settings: { ...s.settings, showPitch: !s.settings.showPitch } }))}
                    className="rounded-full px-4 py-1"
                    style={{
                      border: `1px solid ${state.settings.showPitch ? C.moss : C.line}`,
                      color: state.settings.showPitch ? C.moss : C.muted,
                      fontFamily: MONO,
                      fontSize: 11,
                    }}
                  >
                    {state.settings.showPitch ? "ON" : "OFF"}
                  </button>
                ),
              },
            ].map((r) => (
              <div key={r.label} className="rounded-xl px-4 py-3 flex items-center justify-between" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
                <span style={{ fontFamily: SANS, fontSize: 14, color: C.paper }}>{r.label}</span>
                {r.node}
              </div>
            ))}

            <div className="rounded-xl px-4 py-3" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
              <div className="flex justify-between mb-2">
                <span style={{ fontFamily: SANS, fontSize: 14, color: C.paper }}>Speech speed</span>
                <span style={{ fontFamily: MONO, fontSize: 12, color: C.indigoLt }}>{state.settings.rate.toFixed(2)}×</span>
              </div>
              <input
                type="range"
                min="0.5"
                max="1.2"
                step="0.05"
                value={state.settings.rate}
                onChange={(e) =>
                  set((s) => ({ ...s, settings: { ...s.settings, rate: parseFloat(e.target.value) } }))
                }
                className="w-full"
              />
            </div>

            <div className="rounded-xl px-4 py-3" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
              <div className="flex justify-between mb-2">
                <span style={{ fontFamily: SANS, fontSize: 14, color: C.paper }}>New words per day</span>
                <span style={{ fontFamily: MONO, fontSize: 12, color: C.indigoLt }}>{state.settings.newPerDay}</span>
              </div>
              <input
                type="range"
                min="3"
                max="60"
                step="1"
                value={state.settings.newPerDay}
                onChange={(e) =>
                  set((s) => ({ ...s, settings: { ...s.settings, newPerDay: parseInt(e.target.value) } }))
                }
                className="w-full"
              />
            </div>

            <div className="rounded-xl px-4 py-4" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
              <div className="flex items-center justify-between">
                <Label>Saving</Label>
                <span
                  style={{
                    fontFamily: MONO,
                    fontSize: 11,
                    color:
                      save.status === "ok" ? C.moss : save.status === "checking" ? C.muted : C.brick,
                  }}
                >
                  {save.status.toUpperCase()}
                </span>
              </div>
              <p className="mt-2" style={{ fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.6 }}>
                {save.note}
              </p>
              <div className="flex gap-2 mt-3">
                <button
                  onClick={() => probeStorage().then((t) => setBackup(t))}
                  className="flex-1 rounded-lg py-2"
                  style={{ border: `1px solid ${C.gold}`, color: C.gold, fontFamily: SANS, fontSize: 12 }}
                >
                  Run storage test
                </button>
              </div>
              {backupPanel()}
            </div>

            <div className="rounded-xl px-4 py-4" style={{ background: C.inkSoft, border: `1px solid ${C.line}` }}>
              <Label>About the data</Label>
              <p className="mt-2" style={{ fontFamily: SANS, fontSize: 12, color: C.muted, lineHeight: 1.6 }}>
                {DECK.length} {level} words loaded, of {allWords.length} known
                to this device. {DECK.filter((w) => w.ps !== "generated").length}{" "}
                have pitch accent from Kanjium; the rest are estimated and
                marked ESTIMATED on the card. Deduplicated by written form and
                reading. Progress is saved on this device and, when sync is on,
                to your Netlify site.
              </p>
              <div className="mt-3 pt-3 flex items-center justify-between" style={{ borderTop: `1px solid ${C.line}` }}>
                <span style={{ fontFamily: MONO, fontSize: 10, letterSpacing: "0.14em", color: C.muted }}>
                  VERSION
                </span>
                <span style={{ fontFamily: MONO, fontSize: 12, color: C.indigoLt }}>
                  {APP_VERSION}
                </span>
              </div>
            </div>

            <button
              onClick={() => {
                if (confirm("Erase all progress and start again?"))
                  setState({ ...DEFAULTS, cards: {}, newToday: { date: "", count: 0, bonus: 0 } });
              }}
              className="w-full rounded-xl py-3"
              style={{ border: `1px solid ${C.brick}`, color: C.brick, fontFamily: SANS, fontSize: 13 }}
            >
              Erase progress
            </button>
          </div>
        )}
      </div>
    </div>
  );
}


window.__syncReady.then(() => {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
});
</script>

<script>
/* Update handling: when a new deploy is detected, offer it rather than
   reloading underneath the user mid-review. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    let reg;
    try { reg = await navigator.serviceWorker.register("sw.js"); } catch { return; }

    const offer = (worker) => {
      const bar = document.getElementById("updatebar");
      bar.style.display = "flex";
      document.getElementById("updatebtn").onclick = () => {
        worker.postMessage("skip-waiting");
      };
    };

    if (reg.waiting) offer(reg.waiting);

    reg.addEventListener("updatefound", () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener("statechange", () => {
        // controller present means this is an update, not a first install.
        if (w.state === "installed" && navigator.serviceWorker.controller) offer(w);
      });
    });

    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });

    // Check for a new deploy on launch and whenever the app is reopened.
    const check = () => reg.update().catch(() => {});
    check();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") check();
    });
  });
}
</script>
