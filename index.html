<script>/* ------------------------------------------------------------------ */
/*  STORAGE                                                            */
/*  localStorage is the source of truth for reads, so the app is       */
/*  instant and works with no connection. Writes also push to Netlify  */
/*  Blobs via /api/progress, debounced. On startup we pull and keep    */
/*  whichever copy is newer.                                           */
/* ------------------------------------------------------------------ */
(function () {
  const SYNC_KEY = "jpvocab:syncphrase";
  const STAMP = "jpvocab:updatedAt";
  const KEYS = ["jpvocab:v1", "jpvocab:bank:v1"];

  const phrase = () => localStorage.getItem(SYNC_KEY) || "";
  const stamp = () => Number(localStorage.getItem(STAMP) || 0);

  const status = (text, tone) => {
    const el = document.getElementById("syncbar");
    if (!el) return;
    el.textContent = text;
    el.style.color = tone === "bad" ? "#A85449" : tone === "good" ? "#7A9068" : "#7787A3";
  };

  // Everything the app owns, as one blob.
  const snapshot = () => {
    const out = {};
    for (const k of KEYS) {
      const v = localStorage.getItem(k);
      if (v !== null) out[k] = v;
    }
    return JSON.stringify(out);
  };

  const applySnapshot = (text) => {
    const obj = JSON.parse(text);
    for (const k of KEYS) if (typeof obj[k] === "string") localStorage.setItem(k, obj[k]);
  };

  async function pull() {
    if (!phrase()) return;
    status("Checking for saved progress…");
    try {
      const res = await fetch("/api/progress", { headers: { "x-sync-key": phrase() } });
      const rec = await res.json();
      if (!res.ok) return status(rec.error || "Sync unavailable", "bad");
      if (rec.data && rec.updatedAt > stamp()) {
        applySnapshot(rec.data);
        localStorage.setItem(STAMP, String(rec.updatedAt));
        status("Loaded newer progress from the cloud", "good");
      } else {
        status("Up to date", "good");
      }
    } catch {
      status("Offline — using this device's copy");
    }
  }

  let timer = null;
  function schedulePush() {
    if (!phrase()) return;
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const updatedAt = Date.now();
      try {
        const res = await fetch("/api/progress", {
          method: "PUT",
          headers: { "content-type": "application/json", "x-sync-key": phrase() },
          body: JSON.stringify({ data: snapshot(), updatedAt }),
        });
        const rec = await res.json();
        if (!res.ok) return status(rec.error || "Couldn't sync", "bad");
        localStorage.setItem(STAMP, String(updatedAt));
        status("Synced " + new Date(updatedAt).toLocaleTimeString(), "good");
      } catch {
        status("Offline — will sync when you're back", "bad");
      }
    }, 2000);
  }

  // The interface the app expects, unchanged from the artifact.
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      schedulePush();
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      schedulePush();
      return { key, deleted: true, shared: false };
    },
    async list(prefix = "") {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(prefix)) keys.push(k);
      }
      return { keys, prefix, shared: false };
    },
  };

  // Push once more on the way out, so a session isn't lost to the debounce.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && phrase()) {
      clearTimeout(timer);
      const body = JSON.stringify({ data: snapshot(), updatedAt: Date.now() });
      // keepalive lets the request outlive the page.
      fetch("/api/progress", {
        method: "PUT",
        headers: { "content-type": "application/json", "x-sync-key": phrase() },
        body,
        keepalive: true,
      }).catch(() => {});
    }
  });
  window.addEventListener("online", () => schedulePush());

  window.__sync = {
    phrase,
    async setPhrase(p) {
      localStorage.setItem(SYNC_KEY, p);
      localStorage.setItem(STAMP, "0");
      await pull();
      schedulePush();
    },
    clearPhrase() {
      localStorage.removeItem(SYNC_KEY);
      status("Sync off — this device only");
    },
    pull,
  };

  window.__syncReady = pull();
})();
</script>

<script>
document.getElementById("syncbtn").addEventListener("click", () => {
  const cur = window.__sync.phrase();
  if (cur) {
    if (confirm("Sync is on.\n\nTurn it off on this device? Your progress stays here and in the cloud.")) {
      window.__sync.clearPhrase();
    }
    return;
  }
  const p = prompt(
    "Enter a sync phrase.\n\nUse the same phrase on every device to share progress. " +
    "It is the only thing protecting your data, so make it long and unguessable — " +
    "four or five random words works well.\n\nThere is no way to recover it if you forget it."
  );
  if (p && p.trim().length >= 10) {
    window.__sync.setPhrase(p.trim()).then(() => location.reload());
  } else if (p !== null) {
    alert("That phrase is too short — use at least 10 characters.");
  }
});
</script>

  const seen = new Set();

    seen.add(k);

/* ------------------------------------------------------------------ */
/*  JAPANESE TEXT HELPERS                                              */
/* ------------------------------------------------------------------ */
// Written form with the furigana markup stripped: 食[た]べ物[もの] → 食べ物
const surface = (jp) => jp.replace(/\[[^\]]*\]/g, "");
// Two entries are the same word if the written form and the reading match.
const dedupeKey = (w) => `${surface(w.jp)}|${w.kana}`;

function mergeWords(lists) {
  const seen = new Set();
  const out = [];
  for (const list of lists)
    for (const w of list) {
      const k = dedupeKey(w);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(w);
    }
  return out;
}

const KANJI = /[\u4E00-\u9FAF\u3005]/;
const SMALL = "ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ";

function parseFurigana(src) {
  const out = [];
  let buf = "";
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (ch === "[") {
      const close = src.indexOf("]", i);
      const reading = src.slice(i + 1, close);
      let b = "";
      while (buf.length && KANJI.test(buf[buf.length - 1])) {
        b = buf[buf.length - 1] + b;
        buf = buf.slice(0, -1);
      }
      if (buf) out.push({ t: buf });
      buf = "";
      out.push({ t: b, r: reading });
      i = close;
    } else buf += ch;
  }
  if (buf) out.push({ t: buf });
  return out;
}

function moras(kana) {
  const out = [];
  for (const ch of kana) {
    if (SMALL.includes(ch) && out.length) out[out.length - 1] += ch;
    else out.push(ch);
  }
  return out;
}

function pitchPattern(drop, n) {
  const a = new Array(n + 1).fill(false);
  if (drop === 0) {
    for (let i = 1; i <= n; i++) a[i] = true;
  } else {
    a[0] = drop === 1;
    for (let i = 1; i <= n; i++) a[i] = i < drop;
  }
  return a;
}

const PITCH_NAME = (drop, n) =>
  drop === 0
    ? "平板 heiban — flat, stays high"
    : drop === 1
    ? "頭高 atamadaka — drops after mora 1"
    : drop === n
    ? "尾高 odaka — drops on the particle"
    : `中高 nakadaka — drops after mora ${drop}`;

/*  SPACED REPETITION (SM-2, lightly tuned)                            */

const DAY = 86400000;
const MATURE = 21; // days of interval that counts as "mastered"

function newCard() {
  return { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: 0, seen: false };
}

function grade(card, g) {
  // g: 0 again, 1 hard, 2 good, 3 easy
  let { ease, interval, reps, lapses } = card;
  if (g === 0) {
    reps = 0;
    lapses += 1;
    ease = Math.max(1.3, ease - 0.2);
    interval = 0;
  } else {
    if (reps === 0) interval = g === 3 ? 3 : 1;
    else if (reps === 1) interval = g === 1 ? 2 : g === 2 ? 4 : 6;
    else
      interval = Math.max(
        interval + 1,
        Math.round(interval * (g === 1 ? 1.2 : ease) * (g === 3 ? 1.3 : 1))
      );
    reps += 1;
    ease = Math.max(1.3, ease + (g === 1 ? -0.15 : g === 3 ? 0.1 : 0));
  }
  return {
    ease,
    interval,
    reps,
    lapses,
    seen: true,
    due: Date.now() + (interval === 0 ? 3 * 60000 : interval * DAY),
  };
}

const cardMastery = (c) => (!c || !c.seen ? 0 : Math.min(1, c.interval / MATURE));

const APP_VERSION = "1.6.0";
const LEVELS = ["N5", "N4", "N3", "N2", "N1"];

// Level decks are separate files so a phone only downloads what it studies.
const levelCache = {};
function loadLevel(lv) {
  if (typeof window === "undefined") return Promise.resolve([]);
  const have = (window.JPVOCAB_LEVELS || {})[lv];
  if (have) return Promise.resolve(have);
  if (levelCache[lv]) return levelCache[lv];
  levelCache[lv] = new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = `words-${lv.toLowerCase()}.js`;
    s.onload = () => resolve((window.JPVOCAB_LEVELS || {})[lv] || []);
    s.onerror = () => resolve([]);
    document.head.appendChild(s);
  });
  return levelCache[lv];
}

const KEY = "jpvocab:v1";
const BANK_KEY = "jpvocab:bank:v1";
const DEFAULTS = {
  cards: {},
  unlocked: { N5: 2 },
  settings: { autoplay: true, rate: 0.85, newPerDay: 10, showPitch: true, level: "N5" },
  newToday: { date: "", count: 0, bonus: 0 },
  history: {},   // "YYYY-MM-DD" -> { n, r, g: [again, hard, good, easy] }
};

const GRADES = [
  { key: "again", label: "Again", colour: "#A85449" },
  { key: "hard", label: "Hard", colour: "#B39653" },
  { key: "good", label: "Good", colour: "#7A9068" },
  { key: "easy", label: "Easy", colour: "#8FB0D6" },
];

const HISTORY_DAYS = 120;

function dayKey(d) {
  // Local date, not UTC — a session at 11pm belongs to that evening.
  const z = new Date(d);
  return `${z.getFullYear()}-${String(z.getMonth() + 1).padStart(2, "0")}-${String(
    z.getDate()
  ).padStart(2, "0")}`;
}

function recordAnswer(history, isNew, gradeIndex) {
  const k = dayKey(Date.now());
  const prev = history[k] || { n: 0, r: 0, g: [0, 0, 0, 0] };
  const g = prev.g.slice();
  g[gradeIndex] += 1;
  const next = { ...history, [k]: { n: prev.n + (isNew ? 1 : 0), r: prev.r + (isNew ? 0 : 1), g } };
  // Keep the log bounded; it rides along in every sync payload.
  const keys = Object.keys(next).sort();
  if (keys.length > HISTORY_DAYS)
    for (const old of keys.slice(0, keys.length - HISTORY_DAYS)) delete next[old];
  return next;
}

// The storage bridge differs slightly between hosts, so try the documented
// explicit-shared form first and fall back to the two-argument form.
let WRITE_SHAPE = null;

async function attempt(fn) {
  try {
    const r = await fn();
    return { ok: r !== null && r !== undefined, r };
  } catch (e) {
    return { ok: false, err: String((e && e.message) || e) };
  }
}

async function loadState() {
  if (typeof window === "undefined" || !window.storage)
    return { data: DEFAULTS, status: "unavailable", note: "No storage API on this device." };
  const shapes = [() => window.storage.get(KEY, false), () => window.storage.get(KEY)];
  for (const s of shapes) {
    const { ok, r } = await attempt(s);
    if (ok && r && r.value) {
      try {
        const p = JSON.parse(r.value);
        if (typeof p.unlocked === "number") p.unlocked = { N5: p.unlocked };
        return {
          data: { ...DEFAULTS, ...p, settings: { ...DEFAULTS.settings, ...(p.settings || {}) } },
          status: "ok",
          note: "Loaded your saved progress.",
        };
      } catch {
        return { data: DEFAULTS, status: "ok", note: "Saved data was unreadable; starting fresh." };
      }
    }
  }
  return { data: DEFAULTS, status: "ok", note: "Nothing saved yet." };
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function saveState(s) {
  if (typeof window === "undefined" || !window.storage)
    return { ok: false, note: "No storage API on this device." };
  const payload = JSON.stringify(s);
  const shapes = [
    ["explicit", () => window.storage.set(KEY, payload, false)],
    ["short", () => window.storage.set(KEY, payload)],
  ];
  const ordered = WRITE_SHAPE
    ? shapes.filter((x) => x[0] === WRITE_SHAPE).concat(shapes.filter((x) => x[0] !== WRITE_SHAPE))
    : shapes;
  let last = "";
  // The bridge can come up late, so give it a few tries before giving up.
  for (const wait of [0, 400, 1200]) {
    if (wait) await sleep(wait);
    for (const [name, fn] of ordered) {
      const res = await attempt(fn);
      if (res.ok) {
        WRITE_SHAPE = name;
        return {
          ok: true,
          note: `Saved at ${new Date().toLocaleTimeString()} · ${(payload.length / 1024).toFixed(1)} KB`,
        };
      }
      last = res.err || "the host returned nothing";
    }
  }
  return { ok: false, note: last };
}

async function loadBank() {
  if (typeof window === "undefined" || !window.storage) return [];
  for (const fn of [() => window.storage.get(BANK_KEY, false), () => window.storage.get(BANK_KEY)]) {
    const { ok, r } = await attempt(fn);
    if (ok && r && r.value) {
      try {
        const a = JSON.parse(r.value);
        if (Array.isArray(a)) return a;
      } catch {
        /* unreadable bank — start empty */
      }
    }
  }
  return [];
}

async function saveBank(bank) {
  if (typeof window === "undefined" || !window.storage) return false;
  const payload = JSON.stringify(bank);
  for (const fn of [
    () => window.storage.set(BANK_KEY, payload, false),
    () => window.storage.set(BANK_KEY, payload),
  ]) {
    const res = await attempt(fn);
    if (res.ok) return true;
  }
  return false;
}

async function probeStorage() {
  const out = [];
  if (typeof window === "undefined" || !window.storage) return "No window.storage object exists.";
  out.push(
    "methods: " +
      ["get", "set", "delete", "list"].filter((m) => typeof window.storage[m] === "function").join(", ")
  );
  const tk = "jpvocab:probe";
  for (const [label, fn] of [
    ["set(key,value,false)", () => window.storage.set(tk, "x", false)],
    ["set(key,value)", () => window.storage.set(tk, "x")],
    ["get(key,false)", () => window.storage.get(tk, false)],
    ["list()", () => window.storage.list("jpvocab:", false)],
  ]) {
    const r = await attempt(fn);
    out.push(`${label} → ${r.ok ? "ok" : r.err || "null"}`);
  }
  return out.join("\n");
}

/* ------------------------------------------------------------------ */
/*  FETCHING NEW WORDS                                                 */
/* ------------------------------------------------------------------ */
function validate(raw, level) {
  const catIds = CATS.map((c) => c.id);
  const out = [];
  for (const r of Array.isArray(raw) ? raw : []) {
    if (!r || typeof r.jp !== "string" || typeof r.kana !== "string") continue;
    if (typeof r.en !== "string" || !r.en.trim()) continue;
    if (!catIds.includes(r.cat)) continue;
    const pitch = Number.isInteger(r.pitch) ? r.pitch : -1;
    const n = moras(r.kana).length;
    if (pitch > n) continue;
    // Reject markup we can't render, and readings that aren't kana.
    if ((r.jp.match(/\[/g) || []).length !== (r.jp.match(/\]/g) || []).length) continue;
    if (!/^[\u3040-\u30FFー]+$/.test(r.kana)) continue;
    out.push({
      id: `${r.cat}:${r.kana}:${r.en}`,
      cat: r.cat,
      jp: r.jp.trim(),
      kana: r.kana.trim(),
      en: r.en.trim(),
      pitch,
      ps: "generated",
      level,
      fetched: true,
    });
  }
  return out;
}

function buildPrompt({ level, cat, exclude, count }) {
  const c = CATS.find((x) => x.id === cat);
  const avoid = exclude.slice(-120).join("、");
  return `List ${count} distinct Japanese vocabulary words at JLPT ${level} level in the category "${c.en}" (${c.jp}).

Return ONLY a JSON array. No prose, no markdown fences. Each element:
{"jp":"...","kana":"...","en":"...","cat":"${cat}","pitch":0}

Rules:
- "jp" is the standard written form with furigana in square brackets after each kanji run, e.g. 食[た]べ物[もの], 電車[でんしゃ], 赤[あか]い. Kana-only words have no brackets.
- "kana" is the full reading in kana only.
- "en" is a short English meaning, under six words.
- "pitch" is the standard Tokyo accent drop position as an integer: 0 for heiban, 1 for atamadaka, otherwise the mora after which the pitch drops. It must not exceed the number of morae.
- Words must genuinely fit ${level}, not an easier or harder level.
- Do not include any of these, which are already in the deck: ${avoid || "(none yet)"}
- No duplicates within your own list.`;
}

function parseWordJson(text, level) {
  const cleaned = String(text).replace(/```json|```/g, "").trim();
  const start = cleaned.indexOf("[");
  const end = cleaned.lastIndexOf("]");
  if (start === -1 || end === -1) throw new Error("No JSON list found in that text");
  return validate(JSON.parse(cleaned.slice(start, end + 1)), level);
}

async function fetchWords({ level, cat, exclude, count }) {
  const prompt = buildPrompt({ level, cat, exclude, count });
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!res.ok) throw new Error(`Request failed (${res.status})`);
  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("");
  return parseWordJson(text, level);
}

function useSpeech() {
  const [ok, setOk] = useState(false);
  const voice = useRef(null);
  useEffect(() => {
    if (typeof window === "undefined" || !window.speechSynthesis) return;
    const pick = () => {
      const vs = window.speechSynthesis.getVoices();
      const ja = vs.filter((v) => v.lang && v.lang.toLowerCase().startsWith("ja"));
      voice.current =
        ja.find((v) => /kyoko|otoya|google|nanami|haruka/i.test(v.name)) || ja[0] || null;
      setOk(!!voice.current || vs.length > 0);
    };
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
    return () => {
      window.speechSynthesis.onvoiceschanged = null;
    };
  }, []);
  const say = useCallback((text, rate) => {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.rate = rate ?? 0.85;
    if (voice.current) u.voice = voice.current;
    window.speechSynthesis.speak(u);
  }, []);
  return { say, ok };
}

// Colours are props because this renders on two very different backgrounds:
// the paper-coloured flashcard and the dark browse rows.
function Furigana({ src, size = 64, showRuby = true, color = C.ink, rubyColor = C.indigo }) {
  const parts = useMemo(() => parseFurigana(src), [src]);
  return (
    <span
      style={{
        fontFamily: JP_FACE,
        fontSize: size,
        lineHeight: 1.5,
        color,
        display: "inline-block",
      }}
    >
      {parts.map((p, i) =>
        p.r && showRuby ? (
          <ruby key={i} style={{ rubyAlign: "center" }}>
            {p.t}
            <rt style={{ fontSize: size * 0.3, letterSpacing: "0.04em", color: rubyColor }}>
              {p.r}
            </rt>
          </ruby>
        ) : (
          <span key={i}>{p.t}</span>
        )
      )}
    </span>
  );
}

/* The signature element: an OJAD-style accent contour that traces itself
   in time with the audio. */
function PitchContour({ kana, drop, traceKey, source }) {
  const mo = useMemo(() => moras(kana), [kana]);
  const n = mo.length;
  const pat = pitchPattern(drop, n);
  const step = 30,
    padX = 16,
    hi = 16,
    lo = 40;
  const w = padX * 2 + (n) * step;
  const pts = pat.map((h, i) => [padX + i * step, h ? hi : lo]);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
  const len = pts.reduce(
    (a, p, i) =>
      i === 0 ? 0 : a + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]),
    0
  );
  const reduced =
    typeof window !== "undefined" &&
    window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  return (
    <div className="flex flex-col items-center">
      <svg width={w} height={72} key={traceKey} style={{ overflow: "visible" }}>
        <line x1={padX - 6} y1={hi} x2={w - padX + 6} y2={hi} stroke={C.paperEdge} strokeWidth="1" />
        <line x1={padX - 6} y1={lo} x2={w - padX + 6} y2={lo} stroke={C.paperEdge} strokeWidth="1" />
        <path
          d={d}
          fill="none"
          stroke={C.indigo}
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          style={
            reduced
              ? undefined
              : {
                  strokeDasharray: len,
                  strokeDashoffset: len,
                  animation: `jpTrace ${Math.max(0.5, n * 0.22)}s ease-out forwards`,
                }
          }
        />
        {pts.map(([x, y], i) =>
          i === n ? (
            <circle key={i} cx={x} cy={y} r="4.5" fill={C.paper} stroke={C.indigo} strokeWidth="1.5" strokeDasharray="2 2" />
          ) : (
            <circle key={i} cx={x} cy={y} r="5" fill={C.indigo} />
          )
        )}
        {mo.map((m, i) => (
          <text
            key={i}
            x={padX + i * step}
            y={62}
            textAnchor="middle"
            style={{ fontFamily: JP_FACE, fontSize: 15, fill: C.indigo, opacity: 0.75 }}
          >
            {m}
          </text>
        ))}
        <text
          x={padX + n * step}
          y={62}
          textAnchor="middle"
          style={{ fontFamily: JP_FACE, fontSize: 15, fill: C.muted, opacity: 0.6 }}
        >
          が
        </text>
      </svg>
      <div
        className="mt-1 text-center"
        style={{ fontFamily: SANS, fontSize: 11, color: C.muted, letterSpacing: "0.02em" }}
      >
        {PITCH_NAME(drop, n)}
      </div>
      {source === "generated" && (
        <div
          className="mt-1 rounded-full px-2 py-0.5"
          style={{ fontFamily: MONO, fontSize: 9, letterSpacing: "0.1em",
                   color: C.gold, border: `1px solid ${C.gold}` }}
        >
          ESTIMATED
        </div>
      )}
    </div>
  );
}
